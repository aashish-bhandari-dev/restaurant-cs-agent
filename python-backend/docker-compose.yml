services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-agent-backend
    container_name: restaurant-agent-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - .:/app  
    depends_on:
      - redis
    restart: unless-stopped
    command: ["poetry", "run", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

  redis:
    image: redis:7.0-alpine
    container_name: restaurant-agent-redis
    ports:
      - "6379:6379"  
    volumes:
      - redis-data:/data 
    restart: unless-stopped

networks:
  default:
    name: restaurant-agent-network
    driver: bridge

volumes:
  redis-data: